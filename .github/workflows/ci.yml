name: AiVM CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "codex/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native:
    name: native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native
        if: runner.os != 'Windows'
        run: cmake --preset aivm-native-unix -S ./native

      - name: Build native
        if: runner.os != 'Windows'
        run: cmake --build ./.tmp/aivm-c-build-native

      - name: Test native
        if: runner.os != 'Windows'
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L unit --output-on-failure

      - name: Configure native (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset aivm-native-windows -S ./native

      - name: Build native (Windows)
        if: runner.os == 'Windows'
        run: cmake --build ./.tmp/aivm-c-build-native --config Debug

      - name: Test native (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L unit -C Debug --output-on-failure
