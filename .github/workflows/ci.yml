name: AiVM CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "codex/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native:
    name: native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native
        if: runner.os != 'Windows'
        run: cmake --preset aivm-native-unix -S ./src

      - name: Build native
        if: runner.os != 'Windows'
        run: cmake --build ./.tmp/aivm-c-build-native

      - name: Test native RC gate
        if: runner.os != 'Windows'
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L "unit|integration|golden|security" --output-on-failure

      - name: Test performance smoke
        if: runner.os != 'Windows'
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L perf-smoke --output-on-failure

      - name: Configure native (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset aivm-native-windows -S ./src

      - name: Build native (Windows)
        if: runner.os == 'Windows'
        run: cmake --build ./.tmp/aivm-c-build-native --config Debug

      - name: Test native RC gate (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L "unit|integration|golden|security" -C Debug --output-on-failure

      - name: Test performance smoke (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L perf-smoke -C Debug --output-on-failure

  sanitizers:
    name: sanitizer-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan
            preset: aivm-native-asan-unix
            build_dir: ./.tmp/aivm-c-build-asan
          - sanitizer: ubsan
            preset: aivm-native-ubsan-unix
            build_dir: ./.tmp/aivm-c-build-ubsan

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure ${{ matrix.sanitizer }}
        run: cmake --preset ${{ matrix.preset }} -S ./src

      - name: Build ${{ matrix.sanitizer }}
        run: cmake --build ${{ matrix.build_dir }}

      - name: Test ${{ matrix.sanitizer }}
        run: ctest --test-dir ${{ matrix.build_dir }} -L "unit|integration|golden|security" --output-on-failure
