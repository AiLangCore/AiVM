name: AiVM Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: package-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            id: linux
            archive: tar.gz
          - os: macos-latest
            id: macos
            archive: tar.gz
          - os: windows-latest
            id: windows
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure native
        if: runner.os != 'Windows'
        run: cmake --preset aivm-native-unix -S ./native

      - name: Build native
        if: runner.os != 'Windows'
        run: cmake --build ./.tmp/aivm-c-build-native

      - name: Configure native (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset aivm-native-windows -S ./native

      - name: Build native (Windows)
        if: runner.os == 'Windows'
        run: cmake --build ./.tmp/aivm-c-build-native --config Release

      - name: Stage artifact (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="./artifacts/aivm-${version}-${{ matrix.id }}"
          mkdir -p "${stage}/bin" "${stage}/lib" "${stage}/include"
          cp ./.tmp/aivm-c-build-native/aivm "${stage}/bin/"
          cp ./.tmp/aivm-c-build-native/libaivm_core.a "${stage}/lib/"
          cp ./native/include/*.h "${stage}/include/"
          tar -czf "./aivm-${version}-${{ matrix.id }}.${{ matrix.archive }}" -C artifacts "aivm-${version}-${{ matrix.id }}"

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $stage = ".\artifacts\aivm-$version-${{ matrix.id }}"
          New-Item -ItemType Directory -Force "$stage\bin", "$stage\lib", "$stage\include" | Out-Null
          Copy-Item -Path ".\.tmp\aivm-c-build-native\Release\aivm.exe" -Destination "$stage\bin\"
          Copy-Item -Path ".\.tmp\aivm-c-build-native\Release\aivm_core.lib" -Destination "$stage\lib\"
          Copy-Item -Path ".\native\include\*.h" -Destination "$stage\include\"
          Compress-Archive -Path $stage -DestinationPath ".\aivm-$version-${{ matrix.id }}.${{ matrix.archive }}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivm-${{ matrix.id }}
          path: ./aivm-*-${{ matrix.id }}.${{ matrix.archive }}

  release:
    name: github-release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-local') }}
          files: ./release-assets/*
