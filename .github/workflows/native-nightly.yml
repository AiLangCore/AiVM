name: AiVM Native Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extended-native:
    name: fuzz-stress-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native
        run: cmake --preset aivm-native-unix -S ./src

      - name: Build native
        run: cmake --build ./.tmp/aivm-c-build-native

      - name: Loader fuzz
        env:
          AIVM_FUZZ_ITERATIONS: "50000"
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L fuzz --output-on-failure

      - name: Runtime stress
        env:
          AIVM_STRESS_ITERATIONS: "100000"
          AIVM_STRESS_VM_ITERATIONS: "25000"
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L stress --output-on-failure

      - name: Security
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L security --output-on-failure

      - name: Performance full
        run: ctest --test-dir ./.tmp/aivm-c-build-native -L perf-full --output-on-failure

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: aivm-perf-results
          path: artifacts/perf/*.json
          if-no-files-found: error

  leak-sanitizer:
    name: lsan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure LSAN
        run: cmake --preset aivm-native-lsan-unix -S ./src

      - name: Build LSAN
        run: cmake --build ./.tmp/aivm-c-build-lsan

      - name: Test LSAN
        run: ctest --test-dir ./.tmp/aivm-c-build-lsan -L "unit|integration|golden|security" --output-on-failure
